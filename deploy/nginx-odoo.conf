# /etc/nginx/sites-available/odoo   (cambia facturas.midominio.com)
upstream odoo      { server 127.0.0.1:8069; }
upstream odoo_chat { server 127.0.0.1:8072; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name facturas.midominio.com;
    # certbot añadirá aquí la redirección a HTTPS y el bloque 443
    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La llamada a Gemini puede tardar: debe ser >= limit_time_real de Odoo
    proxy_read_timeout 360s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 360s;

    location /websocket {
        proxy_pass http://odoo_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css text/plain application/json application/javascript;
}
